; Waveshare ESP32-S3-Touch-LCD-2.8C (round 480x480, touch): the full Revsense (Tachi) firmware.
[env:waveshare_s3_round28]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_src_filter = +<*> -<round28_bringup.cpp> -<amoled175_bringup.cpp>
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
lib_deps =
  h2zero/NimBLE-Arduino@^2.1.0
  moononournation/GFX Library for Arduino@^1.6.5

; Same board, display + touch test only (test picture, a dot at each touch). Flash this first to check the hardware.
[env:waveshare_s3_round28_test]
extends = env:waveshare_s3_round28
build_src_filter = -<*> +<round28_bringup.cpp>
lib_deps =
  moononournation/GFX Library for Arduino@^1.6.5

; Waveshare ESP32-S3-Touch-AMOLED-1.75 (round 466x466 AMOLED, CO5300 on QSPI, CST9217 touch): the full firmware on the new board.
; The USB-C port is the ESP32-S3's native USB: to flash, hold BOOT while plugging it in (download mode), then upload. Not yet tried on a real board.
[env:waveshare_s3_amoled175]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_src_filter = +<*> -<round28_bringup.cpp> -<amoled175_bringup.cpp>
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DBOARD_AMOLED175
lib_deps =
  h2zero/NimBLE-Arduino@^2.1.0
  moononournation/GFX Library for Arduino@^1.6.5
  lewisxhe/SensorLib@0.3.1

; Same board, hardware test only: I2C scan, test picture, brightness steps, touch dots, IMU id. Flash this first to check the hardware.
[env:waveshare_s3_amoled175_test]
extends = env:waveshare_s3_amoled175
build_src_filter = -<*> +<amoled175_bringup.cpp>
