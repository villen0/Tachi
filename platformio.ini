; Waveshare ESP32-S3 1.47" display board (Micro Center SKU 967034)
[env:waveshare_s3_lcd147]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_src_filter = +<*> -<round28_bringup.cpp>
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  h2zero/NimBLE-Arduino@^2.1.0
  moononournation/GFX Library for Arduino@^1.6.5
  adafruit/Adafruit NeoPixel@^1.12.0

; Waveshare ESP32-S3-Touch-LCD-2.8C (round 480x480, touch): the full Tachi firmware. Not yet run on hardware.
[env:waveshare_s3_round28]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_src_filter = +<*> -<round28_bringup.cpp>
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DBOARD_ROUND28
lib_deps =
  h2zero/NimBLE-Arduino@^2.1.0
  moononournation/GFX Library for Arduino@^1.6.5

; Same board, display + touch test only (test picture, a dot at each touch). Flash this first to check the hardware.
[env:waveshare_s3_round28_test]
extends = env:waveshare_s3_round28
build_src_filter = -<*> +<round28_bringup.cpp>
lib_deps =
  moononournation/GFX Library for Arduino@^1.6.5
