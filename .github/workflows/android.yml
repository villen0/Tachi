# Builds the Revsense Nav Android app and runs its unit tests. The installable APK is attached to the run (Actions > the run > Artifacts).
name: Android app
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Unit tests (the Maps notification parser)
        run: gradle -p android testDebugUnitTest --no-daemon
      - name: Build the APK
        run: gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: revsense-nav-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
